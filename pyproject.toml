[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[project]
name = "incolume.py.changelog"
version = "1.9.0a2"
description = "Generate CHANGELOG.md"
authors = [
  {name="britodfbr", email =  "contato@incolume.com.br"}
]
maintainers = [
  {name="britodfbr", email =  "contato@incolume.com.br"}
]
readme = "README.md"
requires-python=">=3.11,<4"
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Natural Language :: Portuguese (Brazilian)',
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Utilities',
]
dependencies = [
    "chardet>=7.4.3",
    "click>=8.1.5",
    "gitpython>=3.1.43",
    "icecream>=2.1.5",
    "python-dotenv[cli]>=1.0.1",
    "tomlkit>=0.13.3",
    "unidecode>=1.4.0",
]

[project.urls]
'codecov' = 'https://codecov.io/gh/development-incolume/incolume.py.changelog'
'Documentation' = 'https://development-incolume.github.io/incolume.py.changelog/'
'Source' = 'https://github.com/development-incolume/incolume.py.changelog/releases'
'Git' = 'https://github.com/development-incolume/incolume.py.changelog.git'
'Tracker' = 'https://github.com/development-incolume/incolume.py.changelog/issues'
'Oficial' = 'https://pypi.org/project/incolume.py.changelog/'

[project.scripts]
changelog = 'incolume.py.changelog.cli:changelog'
gcl = 'incolume.py.changelog.cli:changelog'
gencl = 'incolume.py.changelog.cli:changelog'
gchangelog = 'incolume.py.changelog.cli:changelog'
greeting = 'incolume.py.changelog.cli:greeting'

[dependency-groups]
dev = [
  "incolume-py-githooks>=1.24.0",
  "mypy>=1.14.1",
  "mypy-extensions>=1.1.0",
  "poetry>=2.1.4",
  "pre-commit>=4.6.2",
  "pytest-cov>=5.0.0",
  "pytest-env>=1.7.0",
  "pytest-mock>=3.15.1",
  "pytest-timeout>=2.4.0",
  "ruff>=0.12.8",
  "taskipy~=1.12.2",
  "tox>=4.11.4",
  "tox-uv>=1.36.0",
  "ty>=0.0.105",
  "types-toml>=0.10.8.7",
]
doc = [
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.6.16",
  "mkdocs-static-i18n>=1.3.0",
  "mkdocstrings-python>=1.11.1",
  "mkdocstrings>=1.0.6",
]


[project.optional-dependencies]
jupyter =[
"notebook>=7.6.1",
]
security = [
  "bandit>=1.7.6",
  "pip-audit>=2.6.1",
  "safety>=2.3.4",
]


[tool.uv]
allow-insecure-host = ["https://github.com", "https://gitlab.com"]

[tool.uv.build-backend]
module-root = ""
module-name = "incolume.py.changelog"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.sources]
incolume-py-githooks = { git = "https://github.com/development-incolume/incolume.py.githooks", rev = "main" }

[tool.poetry]
# deprecated: será removida em release futura; configuração mantida temporariamente
name = "incolume.py.changelog"
version = "1.9.0a2"
description = "Generate CHANGELOG.md"
license = "Unlicense"
documentation = "https://development-incolume.github.io/incolume.py.changelog/"
repository = "https://github.com/development-incolume/incolume.py.changelog.git"
homepage = "https://pypi.org/project/incolume.py.changelog/"
keywords = ['python', 'utils', 'incolume']
authors = [
  "britodfbr <contato@incolume.com.br>",
]
maintainers = [
  "britodfbr <contato@incolume.com.br>",
]
readme = [
  "README.md",
  "docs/index.md",
]
packages = [
  {include = "incolume", from=""},
]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Natural Language :: Portuguese (Brazilian)',
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Utilities',
]
include = [
  'README.md',
  "CHANGELOG.md",
  'docs/',
  'pyproject.toml',
]
exclude = [
  "examples/",
  "ez_setup",
  "incolumepy/utils/tmp",
  "my_package/excluded.py",
  "tests/",
]

[tool.poetry.group.cli.dependencies]


[tool.bandit]
exclude_dirs = ["tests", "examples", "coverage_report"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]


[tool.bandit.any_other_function_with_shell_equals_true]
no_shell = [
  "os.execl",
  "os.execle",
  "os.execlp",
  "os.execlpe",
  "os.execv",
  "os.execve",
  "os.execvp",
  "os.execvpe",
  "os.spawnl",
  "os.spawnle",
  "os.spawnlp",
  "os.spawnlpe",
  "os.spawnv",
  "os.spawnve",
  "os.spawnvp",
  "os.spawnvpe",
  "os.startfile"
]
shell = [
  "os.system",
  "os.popen",
  "os.popen2",
  "os.popen3",
  "os.popen4",
  "popen2.popen2",
  "popen2.popen3",
  "popen2.popen4",
  "popen2.Popen3",
  "popen2.Popen4",
  "commands.getoutput",
  "commands.getstatusoutput"
]
subprocess = [
  "subprocess.Popen",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output"
]


[tool.taskipy.settings]
#use_vars = true   # set use_vars automaticly

[tool.taskipy.variables]
path = "incolume/ tests/"
VERSIONFILE = "incolume/py/changelog/version.txt"
CHANGELOGFILE = "docs/about/CHANGELOG.md"
URLCOMPARE = "https://github.com/development-incolume/incolume.py.changelog/compare"

[tool.taskipy.tasks]
bandit={help='Checking with bandit', cmd='uv run --extra security bandit -c pyproject.toml -r {path}', use_vars=true}
safety={help='Check safety of packages into project.', cmd='uv run --extra security safety check'}
pre_sec={help='Securance validations', cmd='uv run task bandit && uv run task safety'}
sec={help="Checking environment's safety", cmd=''}
test-all={help='Test all cases', cmd='uv run pytest -m "not webtest"'}
setup = { help = 'Configure environment develop', cmd='git config core.hooksPath .git-hooks/'}
