[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[project]
name = "incolume.py.changelog"
version = "0.19.0"
description = "Generate CHANGELOG.md"
authors = [
  {name="britodfbr", email =  "contato@incolume.com.br"}
]
maintainers = [
  {name="britodfbr", email =  "contato@incolume.com.br"}
]
readme = "README.md"
requires-python=">=3.10,<4"
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Natural Language :: Portuguese (Brazilian)',
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
#  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Utilities',
]
dependencies = [
    "click>=8.1.5",
    "gitpython>=3.1.43",
    "icecream>=2.1.5",
    "python-dotenv[cli]>=1.0.1",
    "tomlkit>=0.13.3",
]

[project.urls]
'codecov' = 'https://codecov.io/gh/development-incolume/incolume.py.changelog'
'Documentation' = 'https://development-incolume.github.io/incolume.py.changelog/'
'Source' = 'https://github.com/development-incolume/incolume.py.changelog/releases'
'Git' = 'https://github.com/development-incolume/incolume.py.changelog.git'
'Tracker' = 'https://github.com/development-incolume/incolume.py.changelog/issues'
'Oficial' = 'https://pypi.org/project/incolume.py.changelog/'

[project.scripts]
changelog = 'incolume.py.changelog.cli:changelog'
gcl = 'incolume.py.changelog.cli:changelog'
gencl = 'incolume.py.changelog.cli:changelog'
gchangelog = 'incolume.py.changelog.cli:changelog'
greeting = 'incolume.py.changelog.cli:greeting'

[dependency-groups]
dev = [
    "bandit>=1.7.6",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.16",
    "mkdocs-static-i18n>=1.3.0",
    "mkdocstrings>=0.26.1",
    "mkdocstrings-python>=1.11.1",
    "mypy>=1.14.1",
    "mypy-extensions>=1.1.0",
    "pip-audit>=2.6.1",
    "poetry>=2.1.4",
    "pytest-cov>=5.0.0",
    "ruff>=0.12.8",
    "safety>=2.3.4",
    "taskipy~=1.12.2",
    "tox>=4.11.4",
    "types-toml>=0.10.8.7",
]
doc = [
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.2",
    "mkdocs-static-i18n>=1.2.0",
    "mkdocstrings-python>=1.7.5",
]
security = [
    "bandit>=1.7.6",
    "pip-audit>=2.6.1",
    "safety>=2.3.4",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""
module-name = "incolume.py.changelog"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.poetry]
name = "incolume.py.changelog"
version = "0.19.0"
description = "Generate CHANGELOG.md"
license = "Unlicense"
documentation = "https://development-incolume.github.io/incolume.py.changelog/"
repository = "https://github.com/development-incolume/incolume.py.changelog.git"
homepage = "https://pypi.org/project/incolume.py.changelog/"
keywords = ['python', 'utils', 'incolume']
authors = [
  "britodfbr <contato@incolume.com.br>",
]
maintainers = [
  "britodfbr <contato@incolume.com.br>",
]
readme = [
  "README.md",
  "docs/index.md",
]
packages = [
  {include = "incolume", from=""},
]
classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Natural Language :: Portuguese (Brazilian)',
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Utilities',
]
include = [
  'README.md',
  "CHANGELOG.md",
  'docs/',
  'pyproject.toml',
]
exclude = [
  "examples/",
  "ez_setup",
  "incolumepy/utils/tmp",
  "my_package/excluded.py",
  "tests/",
]

[tool.poetry.group.dev.dependencies]
# flake8 = "^6.1.0"
# isort = "^5.13.1"
mypy = "^1.7.1"
mypy-extensions = "^1.0.0"
# pydocstyle = "^6.3.0"
# pylint = "^3.0.3"
pytest-cov = "^5.0.0"
taskipy = "^1.12.2"
tox = "^4.11.4"
uv = "^0.8.11"
click = "^8.1.5"
gitpython = "^3.1.43"
icecream = "^2.1.6"
python-dotenv = "^1.1.1"

[tool.poetry.group.cli.dependencies]

[tool.pytest.ini_options]
log_format = '%(asctime)s; %(levelname)-8s; %(name)s; %(module)s; %(funcName)s; %(message)s'
log_date_format ='%Y%m%dT%H%%M%N%z'
addopts = "--doctest-modules --cov=incolume -sx --cov-report term-missing --cov-report html:coverage_report/html --cov-report xml:coverage_report/cov.xml"
testpaths = [
  "tests",
]
python_files = [
  "test_*.py",
  "*_tests.py"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "webtest: marks tests as webtest (deselect with '-m \"not webtest\"')",
  "fasttest: marks tests as fasttest (deselect with '-m \"not fasttest\"')",
]

[tool.mypy]
python_version = "3.10"
mypy_path = "incolume"
namespace_packages = false
check_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

#[[tool.mypy.overrides]]
#disable_error_code = "attr-defined"
#disallow_untyped_defs = true

[tool.tox]
legacy_tox_ini = """
[tox]
minversion = 3.1.0
isolated_build = True
envlist =
    clean
#    black
#    blue
#    isort
#    pydocstyle
    mypy
#    pylint
#    py38
#    py39
    py310
    py311
    py312
    py313
    py314
    ruff_check
    ruff_format

;[tox:.package]
;basepython = python3

[testenv]
whitelist_externals = uv
allowlist_externals = uv
skip_install = true
commands =
    uv sync -p {envpython}
    uv run pytest incolume/ tests/

[testenv:linters]
commands =
  {[testenv:ruff_format]commands}
  {[testenv:ruff_check]commands}
  {[testenv:black]commands}
  {[testenv:isort]commands}
;  {[testenv:flake8]commands}
  {[testenv:pydocstyle]commands}
  {[testenv:mypy]commands}
  {[testenv:pylama]commands}
  {[testenv:pylint]commands}

[testenv:stats]
commands = uv run pytest -xv --cov-report html:coverage_report/html --cov-report xml:coverage_report/cov.xml

;[testenv:flake8]
;deps = flake8
;commands = uv run flake8 --config pyproject.toml incolume/ tests/

[testenv:mypy]
deps =
    mypy
    types-toml
    types-Deprecated
commands = uv run mypy incolume/ tests/

[testenv:ruff_check]
commands = uv run ruff check incolume/ tests/

[testenv:ruff_format]
commands = uv run ruff format incolume/ tests/

[testenv:pydocstyle]
commands = uv run pydocstyle incolume/ tests/

[testenv:isort]
commands = uv run isort --check --atomic --py all incolume/ tests/

[testenv:pylint]
commands = uv run pylint incolume/ tests/

[testenv:black]
commands = uv run black --check incolume/ tests/

[testenv:blue]
commands = uv run blue --check incolume/ tests/

[testenv:safety]
commands = uv run safety check
"""

[tool.bandit]
exclude_dirs = ["tests", "examples", "coverage_report"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]


[tool.bandit.any_other_function_with_shell_equals_true]
no_shell = [
  "os.execl",
  "os.execle",
  "os.execlp",
  "os.execlpe",
  "os.execv",
  "os.execve",
  "os.execvp",
  "os.execvpe",
  "os.spawnl",
  "os.spawnle",
  "os.spawnlp",
  "os.spawnlpe",
  "os.spawnv",
  "os.spawnve",
  "os.spawnvp",
  "os.spawnvpe",
  "os.startfile"
]
shell = [
  "os.system",
  "os.popen",
  "os.popen2",
  "os.popen3",
  "os.popen4",
  "popen2.popen2",
  "popen2.popen3",
  "popen2.popen4",
  "popen2.Popen3",
  "popen2.Popen4",
  "commands.getoutput",
  "commands.getstatusoutput"
]
subprocess = [
  "subprocess.Popen",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output"
]

[tool.ruff]
required-version = ">=0.3.0"

respect-gitignore = true

# indent
#indent-style = "space"
indent-width = 4

# Assume Python Version
target-version = "py38"

# Decrease the maximum line length to 79 character.
line-length = 79

namespace-packages = ["incolume/py/planalto_legis"]

# Allow imports relative to directories
src = ["incolume/", "tests/", "examples/"]

fix = false
force-exclude = true

# Enumerate all fixed violations.
show-fixes = true

# By default, always show source code snippets.
#show-source = true

# warning: The `show-source` option has been deprecated in favor
# of `output-format`'s "full" and "concise" variants.
# Please update your configuration
# to use `output-format = <full|concise>` instead.
#output-format = "concise"
# Group violations by containing file.
# can be: "text" | "json" | "junit" | "github" | "gitlab" | "pylint" | "azure" "grouped"|full|concise
output-format = "full"

# Enable preview features.
preview = true
#docstring-code-format = true

[tool.ruff.format]
indent-style = "space"
quote-style="single"

[tool.ruff.lint]
task-tags = ["TODO", "FIXME"]

# Require explicit selection of preview rules.
explicit-preview-rules = true

# Allow applying all unsafe fixes in the `E` rules and `F401` without the `--unsafe-fixes` flag
extend-safe-fixes = ["E", "F401"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Enable fix for flake8-bugbear (`B`), on top of any rules specified by `fixable`.
extend-fixable = ["B"]

select = [
  "A",    #flake8-builtins
  "AIR",    #Airflow
  "ANN",    #flake8-annotations
  "ARG",    #flake8-unused-arguments
  "ASYNC",    #flake8-async
  "B",    #flake8-bugbear
  "BLE",    #flake8-blind-except
  "C4",    #flake8-comprehensions
  "C90",    #mccabe
  "COM",    #flake8-commas
  "CPY",    #flake8-copyright
  "D",   # pydocstyle
  "DJ",    #flake8-django
  "DTZ",    #flake8-datetimez
  "E",   # pycodestyle
  "W",    #pycodestyle
  "EM",    #flake8-errmsg
  "ERA",    #eradicate
  "EXE",    #flake8-executable
  "F",   # pyflakes
  "FA",    #flake8-future-annotations
  "FBT",    #flake8-boolean-trap
  "FIX",    #flake8-fixme
  "FLY",    #flynt
  "FURB",    #refurb
  "G",    #flake8-logging-format
  "I",    #isort
  "ICN",    #flake8-import-conventions
  "INP",    #flake8-no-pep420
  "INT",    #flake8-gettext
  "ISC",    #flake8-implicit-str-concat
  "N",    #pep8-naming
  "NPY",    #NumPy-specific rules
  "PD",    #pandas-vet
  "PERF",    #Perflint
  "PGH",    #pygrep-hooks
  "PIE",    #flake8-pie
  "PL",    #Pylint
  "PT",    #flake8-pytest-style
  "PTH",    #flake8-use-pathlib
  "PYI",    #flake8-pyi
  "Q",    #flake8-quotes
  "RET",    #flake8-return
  "RSE",    #flake8-raise
  "RUF",    #Ruff-specific rules
  "S",    #flake8-bandit
  "SIM",    #flake8-simplify
  "SLF",    #flake8-self
  "SLOT",    #flake8-slots
  "T10",    #flake8-debugger
  "T20",    #flake8-print
  "TCH",    #flake8-type-checking
  "TD",    #flake8-todos
  "TID",    #flake8-tidy-imports
  "TRY",    #tryceratops
  "UP",  # pyupgrade
  "YTT",    #flake8-2020
]

# Never enforce `E501` (line length violations).
ignore = [
  "INP001",
  "CPY001",
  "FA100",  # Conflit with mypy
  "UP006",  # Conflit with mypy
  "UP007",  # Conflit with mypy
#  "I001",   # conflit with isort
  "ISC001",  # single-line-implicit-string-concatenation
  #  "COM812",  # missing-trailing-comma
]

[tool.ruff.lint.per-file-ignores]
# Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.
#"__init__.py" = ["E402"]
#"path/to/file.py" = ["E402"]
"**/{tutorial}/*" = ["N999"]
"**/{tests,docs,tools,utils}/*" = ["EXE002"]
"**/{*_tests,test_*,*_test}.py" = [
  "ANN001",
  "ANN101",
  "EXE002",
  "I001",
  "PLR6301",
  "S101",
  "ANN401",  # suppress due conflit with mypy
]

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 5

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
ignore-fully-untyped = true
suppress-dummy-args = true
mypy-init-return = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-copyright]
author = "Ruff"
# Avoid enforcing a header on files smaller than 1024 bytes.
min-file-size = 2

[tool.ruff.lint.flake8-quotes]
# Don't bother trying to avoid escapes.
avoid-escape = false
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "list"
parametrize-values-row-type = "tuple"

[tool.ruff.lint.pylint]
max-args = 4


[tool.taskipy.settings]
#use_vars = true   # set use_vars automaticly

[tool.taskipy.variables]
path = "incolume/ tests/"
VERSIONFILE = "incolume/py/changelog/version.txt"
CHANGELOGFILE = "docs/about/CHANGELOG.md"
URLCOMPARE = "https://github.com/development-incolume/incolume.py.changelog/compare"

[tool.taskipy.tasks]
#bandit={help='', cmd='poetry run bandit -c pyproject.toml -r {path}', use_vars=true}
#pre_check-all = {cmd='echo Starting Check all ..', help=''}
#check-all = {cmd='poetry run task clean-all; poetry run task lint; poetry run task sec',  help = "Checking all" }
#post_check-all = {cmd='echo Checking finished!', help=''}
clean = {cmd = "echo -n 'Starting cleanning environment..'; find ./ \\( -wholename '*report_coverage' -o -name '*.pyc' -o -name '*~' -o -name '*.log' -o -name '*.log.*' -o -name '.cache' -o -name '.coverage' \\) -delete ; echo ' ok' ",  help = "Shallow clean into environment (.pyc, .cache, .egg, .log, et all)" }
pre_clean-all = {cmd='poetry run task clean', help=''}
clean-all = {cmd = "echo -n 'Starting Deep cleanning ..'; find ./ \\( -name '*_cache' -o -name '*cache__' -o -name dist -o -name build -o -name .tox -o -name site -o -name coverage_report \\) -exec rm -rf {} 2> /dev/null \\; ; echo ' Deep cleaning finished!' ",  help = "Deep cleanning into environment (dist, build, htmlcov, .tox, *_cache, et all)" }
pre_docs-build={help='Pre docs-build', cmd="uv run task gcl"}
docs-build = {help="Generate documentation", cmd="uv run mkdocs gh-deploy --config-file mkdocs.yml --remote-branch webdoc"}
docs-serve = {help="Run server documentation", cmd="uv run mkdocs serve"}
# gsumary = {help="Generate a sumary with dojos", cmd="uv run sumary -f {sumary_file} -r ", use_vars=true}
# post_gsumary={cmd='git commit -m "docs: Atualização do sumário" {sumary_file}', use_vars=true}
pre_lint="task lint_ruff"
lint={help='Checking all linters configurated', cmd=''}
# lint_mypy={help='Checking with mypy', cmd='echo --mypy--; poetry run mypy --check {path}', use_vars=true}
lint_ruff={help='', cmd='echo --ruff--; uv run ruff check --preview {path}', use_vars=true}
safety={help='Check safety of packages into project.', cmd='uv run safety check'}
pre_sec={help='Securance validations', cmd='uv run task bandit && uv run task safety'}
sec={help="Checking environment's safety", cmd=''}
pre_changelog='uv run pytest'
pre_tests={help='', cmd='task clean-all'}
tests={help='run all tests', cmd='uv run pytest -m "not webtest"'}
pre_test-all={help='', cmd='task lint'}
test-all={help='Test all cases', cmd='task tests'}
changelog = {help='Update changelog file', cmd = "uv run gcl {CHANGELOGFILE} -ru {URLCOMPARE} && echo CHANGELOG file - {CHANGELOGFILE} - updated with success.;echo", use_vars = true }
gcl = {help='Update changelog file', cmd='uv run task changelog'}
setup = { help = 'Configure environment develop', cmd='git config core.hooksPath .git-hooks/'}
