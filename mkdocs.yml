extra:
  commands:
    run: incolume

nav:
    - Home: index
    - API: api/index
    - Instalação: user_guide/INSTALLATION
    - Uso: user_guide/usage
    - Desenvolvimento: user_guide/development
    - 'Guia do Usuário':
        - Convenções: user_guide/README
        - Código de Conduta: user_guide/code_of_conduct
        - Metodologias:
            - Conventional Commit: user_guide/COVENTIONAL_COMMITS
            - Keep a CHANGELOG: user_guide/keep-a-changelog
            - MarkDown: user_guide/markdown
            - Mkdocs: user_guide/writing-your-docs
            - Semver: user_guide/semver
            - Zen Python: user_guide/zenpy
