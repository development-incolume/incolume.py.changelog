site_name: Incolume Python Changelog
repo_url: https://github.com/development-incolume/incolume.py.changelog
repo_name: incolume.py.changelog
edit_uri: tree/dev/docs

theme:
  name: material
  language: pt-BR
  logo: asserts/img/cl_logo.png
  favicon: asserts/img/jedi_logo.png
  palette:
    # Palette toggle for light mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.tasklist
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: "#"

extra_css:
  - stylesheets/extra.css

watch:
  - incolume

exclude_docs: |
  analysis_artifacts/*

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [incolume]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          build: true
          name: Deutsch
          nav_translations:
                Home: Startseite
                API: API
                Instalação: Installation
                Uso: Verwendung
                Desenvolvimento: Entwicklung
                Guia do Usuário: Benutzerhandbuch
                Convenções: Konventionen
                Código de Conduta: Verhaltenskodex
                Metodologias: Methoden
                Conventional Commit: Herkömmliche Verpflichtung
                Keep a CHANGELOG: Führen Sie ein Änderungsprotokoll
                MarkDown: MarkDown
                Mkdocs: Mkdocs
                Semver: Semver
                Zen Python: Zen Python
                Sobre: Über
                Contribuidores: Mitwirkende
                Licença: Lizenz
                Notas de lançamento: Versionshinweise
                Plano de documentação: Dokumentationsplan
                PRD: PRD
                ADR: ADR
                SPEC: SPEC
                Glossário: Glossar

