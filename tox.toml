requires = ["tox>=4.19", "uv>=0.11.0"]
env_list = ["3.14", "3.13", "3.12", "3.11", "typing"]

# Core configuration for all test environments (fallback defaults)
[env_run_base]
description = "Run test under {base_python}"
allowlist_externals = ["ty"]
deps = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-env",
    "pytest-mock",
    "pytest-timeout",
]
commands = [
    ["pytest", "tests", "incolume"]
]

# Custom environment specific to linting
[env.lint]
description = "Run static analysis"
skip_install = true
deps = [
    "ruff"
]
commands = [
    ["ruff", "check", "--fix", "tests", "incolume"],
    ["ruff", "format", "tests", "incolume"]
]

[env.typing]
description = "run type check on code base"
deps = ["ty>=0.0.105"]
commands = [["ty", "check", "tests", "incolume"]]
