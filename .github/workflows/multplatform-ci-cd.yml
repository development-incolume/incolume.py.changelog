name: Multiplataform GWA CI/CD    # Success run

on:
  workflow_dispatch:
   inputs:
     environment:
       description: 'The environment to deploy to (e.g. production, staging)'
       required: true
       default: 'tags'
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
    tags:
      - "*.*.*"

jobs:
  linters:
    name: Check Quality Assurance
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv ruff
          uv sync

      - name: Check static type
        continue-on-error: true
        run: |
          uv run mypy incolume/ tests/
          uv run ty incolume/ tests/

      - name: Format with ruff
        continue-on-error: false
        run: uv run ruff format incolume/ tests/

      - name: Lint with ruff
        continue-on-error: false
        run: |
          uv run ruff check --fix incolume/ tests/

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: 'Code formated with ruff'


  test:
    runs-on: ${{ matrix.os }}
    needs: [linters]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install -U uv pip
        uv sync

    - name: Test with pytest and generate coverage report
      run: |
        uv run pytest -vv

  coverage:
    name: Coverage by codecov
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Install dependencies
        run: |
          python -m pip install -U uv pip
          uv sync --all-packages --all-groups --all-extras
      - name: Generate coverage report
        run: uv run pytest -q
      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
        with:
          files: coverage_report/cov.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}


  build:
    name: Build package release
    runs-on: "ubuntu-latest"
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install -U uv pip
          uv sync

      - name: Build version
        run: |
          uv -V

      - name: Build package with uv
        run: |
          uv build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: success()   # failure():: => contexts#job-status-check-functions
        with:
          name: build-package
          path: dist/
          if-no-files-found: error   # 'error', 'warn' or 'ignore' are also available, defaults to `warn`

  tagged-release:
    name: "Tagged Release"
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-package
          path: dist/

      - uses: "marvinpinto/action-automatic-releases@latest"
        continue-on-error: true
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
          files: |
            dist/*

  publish-testpypi:
    name: Publish Test PyPI
    runs-on: ubuntu-latest
    needs: [tagged-release]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install -U uv

      - uses: actions/download-artifact@v4
        with:
          name: build-package
          path: dist/

      - name: Publish to testpypi
        continue-on-error: true
        run: |
          uv publish --index testpypi --token ${{ secrets.TEST_PYPI_TOKEN }}

  publish-pypi:
    name: Publish PyPI
    runs-on: ubuntu-latest
    needs: [tagged-release]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install -U uv

      - uses: actions/download-artifact@v4
        with:
          name: build-package
          path: dist/

      - name: Publish to pypi
        continue-on-error: true
        run: |
          uv publish --token ${{ secrets.PYPI_TOKEN }}
