name: Docs Generator by CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv
          uv sync --all-groups

      - name: Generate and deploy the documentation
        run: |
          git pull origin
          uv run mkdocs gh-deploy --config-file mkdocs.yml --remote-branch webdoc
